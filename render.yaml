services:
  - type: web
    name: memos
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./scripts/Dockerfile
    dockerContext: .
    envVars:
      - key: MEMOS_MODE
        value: prod
      - key: MEMOS_PORT
        value: "5230"
    disk:
      name: memos-data
      mountPath: /var/opt/memos
      sizeGB: 1
